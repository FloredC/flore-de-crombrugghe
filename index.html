<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flore de Crombrugghe — Senior Product Designer</title>
    <!-- SVG favicon: scales to every size a browser asks for, so there's no
         separate 16/32/180 set to keep in sync. Root-relative is correct now
         that the site is served from a custom domain root; it was written out
         as /flore-de-crombrugghe/favicon.svg while this was a project site,
         where a root-relative path would have resolved off-site. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta
      name="description"
      content="Flore de Crombrugghe — Senior Product Designer in Zurich, designing consumer apps and internal tools for high-stakes, large-scale services."
    />

    <!-- Link preview. This matters now in a way it didn't before the site was
         deployed: the portfolio is about to be sent to design managers and HR,
         and without these a shared link unfurls as a bare URL with no title or
         summary. og:* covers LinkedIn, Slack, WhatsApp and iMessage; the two
         twitter:* tags cover X, which ignores og:type.

         og:image is live, 1200x630 as every platform expects. The explicit
         width/height let a crawler reserve the space before the image loads.
         twitter:image is separate because X does not read og:image when a
         twitter:card is declared.

         The URLs are absolute because crawlers do not resolve relative paths,
         so they name the custom domain literally. That makes this a third place
         that moves alongside BASE in vite.config.js and public/CNAME whenever
         the site's origin changes -- it did on 2026-09-01, from the github.io
         project-site path to floredecrombrugghe.com.

         THESE ARE THE HOMEPAGE'S TAGS ONLY. Every other route gets its own
         title/description/image written into its own static HTML file at build
         time by scripts/prerender.mjs, because a crawler does not run the JS
         that would otherwise set them. See that file before editing these. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flore de Crombrugghe" />
    <meta property="og:title" content="Flore de Crombrugghe — Senior Product Designer" />
    <meta
      property="og:description"
      content="An illustrated map of my work: consumer apps and internal tools for high-stakes, large-scale services."
    />
    <meta property="og:url" content="https://floredecrombrugghe.com/" />
    <meta property="og:image" content="https://floredecrombrugghe.com/images/link-previews/home.png" />
    <meta property="og:image:alt" content="An illustrated island map of Flore de Crombrugghe's design work." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="https://floredecrombrugghe.com/images/link-previews/home.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Flore de Crombrugghe — Senior Product Designer" />
    <meta
      name="twitter:description"
      content="An illustrated map of my work: consumer apps and internal tools for high-stakes, large-scale services."
    />
    <script>
      // ARM THE SCROLL REVEALS.
      //
      // Every reveal's hidden state is gated on this attribute, and nothing in
      // the stylesheet hides anything without it. That inversion is the whole
      // safety property: if this script never runs -- JS disabled, a bundle
      // that 404s, an old browser -- the page renders finished rather than
      // blank. The usual recipe puts `opacity: 0` in the CSS and has the app
      // remove it, which fails the other way round.
      //
      // Inline and synchronous in <head>, before the module below, so the flag
      // is present at first paint. Set it any later and the first section
      // paints visible and then jumps to hidden as the app hydrates.
      //
      // Skipped entirely for readers who asked for less motion, so the reveals
      // are never armed for them at all. The CSS has its own
      // prefers-reduced-motion guard as well; this is the belt to that's braces
      // and it costs one line.
      if (!window.matchMedia || !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.setAttribute('data-reveal-armed', '')
      }
    </script>
    <script>
      // Second half of the GitHub Pages deep-link fix -- see public/404.html for
      // the full explanation. That page turns /work/artifakt into /?/work/artifakt
      // and lands here; this turns it back into the real path with
      // history.replaceState.
      //
      // It MUST run before the app's module script below, and synchronously, so
      // React Router sees the corrected URL on its very first render rather than
      // booting at "/" and then jumping. Inline and un-deferred for that reason.
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>

    <!-- Google Analytics 4.

         The Measurement ID is not a secret: it ships in the HTML of every page
         that uses it, and names a destination rather than granting access. The
         credentials that WOULD grant access to the property -- a service-account
         key, a Measurement Protocol api_secret -- are not here and must not be.

         DELIBERATELY PLACED AFTER the history-restore script above. That script
         rewrites /?/work/artifakt back into /work/artifakt, and gtag reads
         location at load time. Loading the tag any earlier would record the
         encoded form as the page path and split one page's traffic across two
         unreadable URLs. Prerendering means most deep links no longer take that
         route at all, but process logs and mistyped URLs still do.

         Client-side route changes are counted by GA4's Enhanced Measurement
         ("page changes based on browser history events", on by default), which
         is why there is no manual page_view call here. Known limitation, worth
         writing down rather than rediscovering: that fires on the history
         change, which is before React has rendered and set the new
         document.title, so an in-app navigation can be logged under the
         PREVIOUS page's title. The page path is always correct. Direct loads
         are unaffected -- prerendering gives each route its real title in the
         served HTML.

         Not consent-gated. Analytics cookies plus Swiss/EU visitors is a real
         question; the deliberate v1 answer is "ship, then decide". Flagged
         2026-09-01, not overlooked. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZBHGLT0FQ1"></script>
    <script>
      window.dataLayer = window.dataLayer || []
      function gtag() {
        dataLayer.push(arguments)
      }
      gtag('js', new Date())
      gtag('config', 'G-ZBHGLT0FQ1')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
